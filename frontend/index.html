<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HerPulse — Period. Decoded.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .splash {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }
  .splash-logo {
    width: min(78vw, 340px);
    opacity: 0;
    transform: scale(0.82) translateY(14px);
    animation: logoIn 1.1s cubic-bezier(.22,.9,.32,1) 0.15s forwards;
  }
  @keyframes logoIn {
    to { opacity: 1; transform: scale(1) translateY(0); }
  }
  .splash-tag {
    font-family: var(--font-mono);
    font-size: 13px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--pulse-magenta);
    opacity: 0;
    margin-top: 4px;
    animation: tagIn 0.8s ease 1.05s forwards;
  }
  @keyframes tagIn { to { opacity: 0.75; } }

  .splash-pulse { position: absolute; bottom: 64px; width: min(80vw, 360px); opacity: 0; animation: tagIn 0.8s ease 1.3s forwards; }

  .skip-hint {
    position: absolute;
    bottom: 22px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0;
    animation: tagIn 0.8s ease 1.9s forwards;
  }

  .sparkle-a { top: 18%; left: 14%; width: 22px; animation-delay: .2s; }
  .sparkle-b { bottom: 26%; right: 12%; width: 16px; animation-delay: .9s; }
  .sparkle-c { top: 30%; right: 18%; width: 12px; animation-delay: 1.5s; }
</style>
</head>
<body>
  <div class="splash" id="splash" role="button" aria-label="Continue to login" tabindex="0">
    <svg class="sparkle sparkle-a" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0l2.2 8.8L22 11l-7.8 2.2L12 22l-2.2-8.8L2 11l7.8-2.2z"/></svg>
    <svg class="sparkle sparkle-b" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0l2.2 8.8L22 11l-7.8 2.2L12 22l-2.2-8.8L2 11l7.8-2.2z"/></svg>
    <svg class="sparkle sparkle-c" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0l2.2 8.8L22 11l-7.8 2.2L12 22l-2.2-8.8L2 11l7.8-2.2z"/></svg>

    <img src="assets/logo.png" alt="HerPulse — Period. Decoded." class="splash-logo">
    <div class="splash-tag">Smart period screening</div>

    <div class="splash-pulse pulse-line">
      <svg viewBox="0 0 340 40" preserveAspectRatio="none"><path d="M0 20 L70 20 L88 5 L104 35 L120 20 L340 20"/></svg>
    </div>

    <div class="skip-hint">Tap anywhere to continue</div>
  </div>

  <script>
    const splash = document.getElementById('splash');
    let navigated = false;
    function goNext() {
      if (navigated) return;
      navigated = true;
      window.location.href = 'login.html';
    }
    splash.addEventListener('click', goNext);
    splash.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') goNext(); });
    setTimeout(goNext, 2800);
  </script>
</body>
</html>
