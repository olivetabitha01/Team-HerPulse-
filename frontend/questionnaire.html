<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire — HerPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .q-card { min-height: 340px; display: flex; flex-direction: column; }
  .q-eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--pulse-pink-deep); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 8px; }
  .q-text { font-family: var(--font-display); font-size: 21px; color: var(--ink); font-weight: 700; line-height: 1.3; }
  .q-body { flex: 1; }
  .q-nav { display: flex; gap: 10px; margin-top: 10px; }
  .q-nav .btn { width: auto; flex: 1; }
  .scale-row { display: flex; gap: 8px; margin: 20px 0 8px; }
  .scale-btn {
    flex: 1; aspect-ratio: 1; border-radius: 14px; border: 1.5px solid var(--line);
    background: var(--blush); font-family: var(--font-mono); font-weight: 700; font-size: 16px;
    cursor: pointer; transition: all .15s var(--ease);
  }
  .scale-btn.selected { border-color: var(--pulse-pink-deep); background: var(--pulse-pink); color: #fff; }
  .scale-caption { display:flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-bottom: 4px; }
  .checkbox-list .option-pill .dot { border-radius: 5px; }
  .checkbox-list .option-pill.selected .dot::after { border-radius: 2px; inset: 4px; }
  .fade-in { animation: fadeQ .3s var(--ease); }
  @keyframes fadeQ { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
  <div class="screen">
    <div class="app-header">
      <img src="assets/logo.png" alt="HerPulse">
      <span class="eyebrow">Health check-in</span>
    </div>

    <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:10%"></div></div>
    <div class="progress-label"><span id="progressText">Question 1 of 10</span><span id="progressPct">10%</span></div>

    <div class="card q-card">
      <div class="q-body" id="qBody"><!-- injected --></div>

      <div class="q-nav">
        <button class="btn btn-ghost" id="backBtn">Back</button>
        <button class="btn btn-primary" id="nextBtn" disabled>Next</button>
      </div>
    </div>

    <p class="footnote">Answers help correlate your sensor readings with how you're actually feeling.</p>
  </div>

  <script src="js/api.js"></script>
  <script>
    requireSession();

    const QUESTIONS = [
      { id: 'cycle_regularity', text: 'Is your menstrual cycle regular?', type: 'single',
        options: ['Yes', 'No', 'Sometimes'] },
      { id: 'cycle_length', text: 'How many days does your cycle usually last?', type: 'single',
        options: ['Under 21 days', '21–35 days', 'Over 35 days'] },
      { id: 'flow_intensity', text: 'How would you describe your menstrual flow?', type: 'single',
        options: ['Light', 'Medium', 'Heavy'] },
      { id: 'clots', text: 'Do you notice blood clots during your period?', type: 'single',
        options: ['Yes', 'No'] },
      { id: 'pain_level', text: 'Rate your menstrual pain (cramps).', type: 'scale', scaleMax: 5,
        caption: ['Mild', 'Severe'] },
      { id: 'conditions', text: 'Do you have any of the following?', type: 'multi',
        options: ['Thyroid', 'PCOS / PCOD', 'None'] },
      { id: 'status', text: 'Which applies to you right now?', type: 'single',
        options: ['Pregnant', 'Trying to conceive', 'Menopause', 'None'] },
      { id: 'symptoms', text: 'Have you noticed any unusual symptoms recently?', type: 'multi',
        options: ['Unusual odor', 'Unusual discharge', 'Irritation', 'None'] },
      { id: 'emotional_state', text: 'How do you feel emotionally during your cycle?', type: 'single',
        options: ['Normal', 'Irritated', 'Anxious', 'Depressed'] },
      { id: 'energy_level', text: 'How is your energy level and appetite?', type: 'single',
        options: ['Normal', 'Low energy', 'High fatigue'] },
    ];

    let current = 0;
    const answers = {}; // held in memory for this session only, submitted as a batch at the end

    const qBody = document.getElementById('qBody');
    const backBtn = document.getElementById('backBtn');
    const nextBtn = document.getElementById('nextBtn');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const progressPct = document.getElementById('progressPct');

    function renderQuestion() {
      const q = QUESTIONS[current];
      const pct = Math.round(((current + 1) / QUESTIONS.length) * 100);
      progressFill.style.width = pct + '%';
      progressText.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
      progressPct.textContent = pct + '%';
      backBtn.style.visibility = current === 0 ? 'hidden' : 'visible';

      let html = `<div class="fade-in"><div class="q-eyebrow">${q.type === 'multi' ? 'Select all that apply' : 'Choose one'}</div><div class="q-text">${q.text}</div>`;

      if (q.type === 'scale') {
        html += `<div class="scale-caption"><span>${q.caption[0]}</span><span>${q.caption[1]}</span></div>`;
        html += `<div class="scale-row">`;
        for (let i = 1; i <= q.scaleMax; i++) {
          const sel = answers[q.id] === i ? 'selected' : '';
          html += `<button type="button" class="scale-btn ${sel}" data-val="${i}">${i}</button>`;
        }
        html += `</div>`;
      } else {
        html += `<div class="option-list ${q.type === 'multi' ? 'checkbox-list' : ''}">`;
        q.options.forEach(opt => {
          const selected = q.type === 'multi'
            ? (answers[q.id] || []).includes(opt)
            : answers[q.id] === opt;
          html += `<div class="option-pill ${selected ? 'selected' : ''}" data-val="${opt}"><span class="dot"></span>${opt}</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
      qBody.innerHTML = html;

      updateNextState();
      attachHandlers(q);
    }

    function attachHandlers(q) {
      if (q.type === 'scale') {
        qBody.querySelectorAll('.scale-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            answers[q.id] = parseInt(btn.dataset.val, 10);
            renderQuestion();
          });
        });
      } else if (q.type === 'multi') {
        qBody.querySelectorAll('.option-pill').forEach(pill => {
          pill.addEventListener('click', () => {
            const val = pill.dataset.val;
            const list = answers[q.id] || [];
            const idx = list.indexOf(val);
            if (idx >= 0) list.splice(idx, 1); else list.push(val);
            answers[q.id] = list;
            renderQuestion();
          });
        });
      } else {
        qBody.querySelectorAll('.option-pill').forEach(pill => {
          pill.addEventListener('click', () => {
            answers[q.id] = pill.dataset.val;
            renderQuestion();
          });
        });
      }
    }

    function updateNextState() {
      const q = QUESTIONS[current];
      const a = answers[q.id];
      const answered = q.type === 'multi' ? (a && a.length > 0) : (a !== undefined && a !== null);
      nextBtn.disabled = !answered;
      nextBtn.textContent = current === QUESTIONS.length - 1 ? 'Finish' : 'Next';
    }

    backBtn.addEventListener('click', () => { if (current > 0) { current--; renderQuestion(); } });

    nextBtn.addEventListener('click', async () => {
      if (current < QUESTIONS.length - 1) {
        current++;
        renderQuestion();
      } else {
        nextBtn.disabled = true;
        nextBtn.textContent = 'Submitting…';
        try {
          await HerPulseAPI.submitAnswers(answers);
          window.location.href = 'processing.html';
        } catch (err) {
          nextBtn.disabled = false;
          nextBtn.textContent = 'Finish';
          alert(err.message || 'Could not submit answers. Please try again.');
        }
      }
    });

    renderQuestion();
  </script>
</body>
</html>
